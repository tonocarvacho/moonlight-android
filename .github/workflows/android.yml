# Builds the signed release APK of the fork and publishes it as a GitHub
# Release; the newest one is always at
# https://github.com/tonocarvacho/moonlight-android/releases/latest/download/moonlight.apk
# Docs: Docs/android.md
name: Android

on:
  push:
    branches: [master]
    paths-ignore: ['Docs/**', '**.md', 'store-assets/**', 'fastlane/**']
  workflow_dispatch:

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write # create the release

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      APK: app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk
      NDK: 29.0.14206865 # keep in sync with ndkVersion in app/build.gradle
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0 # tags + history for the release notes

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" > /dev/null

      - name: Build signed APK
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          ./gradlew assembleNonRootRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          APP_VERSION_CODE: ${{ github.run_number }}

      - name: Check the APK is signed with the release key
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$APK" | grep -q 'CN=Moonlight Fork'

      - name: Publish the release
        # update.json drives the in-app updater (Docs/updates.md)
        run: |
          meta=app/build/outputs/apk/nonRoot/release/output-metadata.json
          code=$(jq -r '.elements[0].versionCode' "$meta")
          version=$(jq -r '.elements[0].versionName' "$meta")
          cp "$APK" moonlight.apk
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          notes=$(git log --no-merges --format='• %s' ${prev:+$prev..}HEAD | head -15)
          jq -n --argjson versionCode "$code" --arg versionName "$version" \
            --arg apk "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/moonlight.apk" \
            --arg sha256 "$(sha256sum moonlight.apk | cut -d' ' -f1)" --arg notes "$notes" \
            '{versionCode: $versionCode, versionName: $versionName, apk: $apk, sha256: $sha256, notes: $notes}' > update.json
          cat update.json
          gh release create "v$version" moonlight.apk update.json --latest \
            --title "Moonlight Fork $version" \
            --notes "$notes

          Built from ${GITHUB_SHA::7}. Update from the app (Settings → Check for updates) or download moonlight.apk on the phone and open it."
        env:
          GH_TOKEN: ${{ github.token }}
